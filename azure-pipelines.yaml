trigger:
  branches:
    include:
      - main
      - dev

  paths:
    include:
      - iac/terraform/**

resources:
  repositories:
    - repository: templates
      type: github
      name: jhoangaleano1993/AzureDevOpsTemplate
      ref: refs/heads/dev
      endpoint: GitHubConnection

pool:
  name: Default

variables:
  - name: terraformVersion
    value: '1.13.0'
  - name: workingDirectory
    value: '$(System.DefaultWorkingDirectory)/iac/terraform'
  - name: backendS3Bucket
    value: 'tfstate-devops-289997607932'
  - name: backendDynamoDBTable
    value: 'terraform-state-lock'
  - name: backendKey
    value: 'eks-cluster.tfstate'
  - name: awsRegion
    value: 'us-east-1'
  - group: AWS-Credentials

stages:
  - stage: Validate
    displayName: 'Terraform Validate'
    jobs:
      - job: TerraformValidate
        displayName: 'Validate Terraform Configuration'
        steps:
          # Instalar Terraform
          - template: templates/install-terraform.yml@templates
            parameters:
              terraformVersion: $(terraformVersion)

          # Inicializar Terraform
          - template: templates/terraform-init.yml@templates
            parameters:
              workingDirectory: $(workingDirectory)
              backendS3Bucket: $(backendS3Bucket)
              backendKey: $(backendKey)
              backendRegion: $(awsRegion)
              backendDynamoDBTable: $(backendDynamoDBTable)
              awsAccessKeyId: $(AWS_ACCESS_KEY_ID)
              awsSecretAccessKey: $(AWS_SECRET_ACCESS_KEY)
              awsRegion: $(awsRegion)

          # Validar y verificar formato (estricto en PRs)
          - template: templates/terraform-validate.yml@templates
            parameters:
              workingDirectory: $(workingDirectory)
              strictFormatCheck: true

  - stage: Plan
    displayName: 'Terraform Plan'
    dependsOn: Validate
    condition: succeeded()
    jobs:
      - job: TerraformPlan
        displayName: 'Plan Infrastructure Changes'
        steps:
          # Instalar Terraform
          - template: templates/install-terraform.yml@templates
            parameters:
              terraformVersion: $(terraformVersion)

          # Inicializar Terraform
          - template: templates/terraform-init.yml@templates
            parameters:
              workingDirectory: $(workingDirectory)
              backendS3Bucket: $(backendS3Bucket)
              backendKey: $(backendKey)
              backendRegion: $(awsRegion)
              backendDynamoDBTable: $(backendDynamoDBTable)
              awsAccessKeyId: $(AWS_ACCESS_KEY_ID)
              awsSecretAccessKey: $(AWS_SECRET_ACCESS_KEY)
              awsRegion: $(awsRegion)

          # Generar plan de Terraform
          - template: templates/terraform-plan.yml@templates
            parameters:
              workingDirectory: $(workingDirectory)
              awsAccessKeyId: $(AWS_ACCESS_KEY_ID)
              awsSecretAccessKey: $(AWS_SECRET_ACCESS_KEY)
              awsRegion: $(awsRegion)
              timeoutInMinutes: 15

          # Publicar plan como artefacto
          - task: PublishPipelineArtifact@1
            displayName: 'Publish Terraform Plan'
            inputs:
              targetPath: '$(workingDirectory)/tfplan'
              artifact: 'terraform-plan'
              publishLocation: 'pipeline'

          - task: PublishPipelineArtifact@1
            displayName: 'Publish Terraform Files'
            inputs:
              targetPath: '$(workingDirectory)'
              artifact: 'terraform-files'
              publishLocation: 'pipeline'

  - stage: Apply
    displayName: 'Terraform Apply'
    dependsOn: Plan
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: TerraformApply
        displayName: 'Apply Infrastructure Changes'
        environment: 'Development'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                # Instalar herramientas (Terraform, AWS CLI, kubectl)
                - template: templates/install-terraform.yml@templates
                  parameters:
                    terraformVersion: $(terraformVersion)
                    installAwsCli: true
                    installKubectl: true

                # Descargar plan generado en stage anterior
                - task: DownloadPipelineArtifact@2
                  displayName: 'Download Terraform Plan'
                  inputs:
                    artifact: 'terraform-plan'
                    path: '$(workingDirectory)'

                # Inicializar Terraform
                - template: templates/terraform-init.yml@templates
                  parameters:
                    workingDirectory: $(workingDirectory)
                    backendS3Bucket: $(backendS3Bucket)
                    backendKey: $(backendKey)
                    backendRegion: $(awsRegion)
                    backendDynamoDBTable: $(backendDynamoDBTable)
                    awsAccessKeyId: $(AWS_ACCESS_KEY_ID)
                    awsSecretAccessKey: $(AWS_SECRET_ACCESS_KEY)
                    awsRegion: $(awsRegion)

                # Aplicar plan de Terraform
                - template: templates/terraform-apply.yml@templates
                  parameters:
                    workingDirectory: $(workingDirectory)
                    planFile: 'tfplan'
                    awsAccessKeyId: $(AWS_ACCESS_KEY_ID)
                    awsSecretAccessKey: $(AWS_SECRET_ACCESS_KEY)
                    awsRegion: $(awsRegion)

                # Verificar cluster EKS
                - task: Bash@3
                  displayName: 'Configure kubectl and verify cluster'
                  inputs:
                    targetType: 'inline'
                    script: |
                      # Configurar kubectl
                      aws eks update-kubeconfig --name devops-eks --region $(awsRegion)

                      # Verificar nodos
                      echo "=== Kubernetes Nodes ==="
                      kubectl get nodes -o wide

                      # Verificar pods
                      echo "=== All Pods ==="
                      kubectl get pods -A

                      # Verificar addons
                      echo "=== EKS Addons ==="
                      aws eks list-addons --cluster-name devops-eks --region $(awsRegion)
                  env:
                    AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
                    AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
                    AWS_DEFAULT_REGION: $(awsRegion)

                # Configurar RBAC en Kubernetes
                - task: Bash@3
                  displayName: 'Setup RBAC for Azure DevOps'
                  inputs:
                    targetType: 'inline'
                    workingDirectory: '$(System.DefaultWorkingDirectory)/k8s/rbac'
                    script: |
                      echo "=== Configurando RBAC para Azure DevOps ==="

                      # Aplicar manifiestos de RBAC
                      echo "Creando namespace 'devops'..."
                      kubectl apply -f namespace.yaml

                      echo "Creando ServiceAccount 'azure-devops-sa'..."
                      kubectl apply -f serviceaccount.yaml

                      echo "Creando Role..."
                      kubectl apply -f role.yaml

                      echo "Creando RoleBinding..."
                      kubectl apply -f rolebinding.yaml

                      echo "Creando ClusterRole..."
                      kubectl apply -f clusterrole.yaml

                      echo "Creando ClusterRoleBinding..."
                      kubectl apply -f clusterrolebinding.yaml

                      echo "Esperando a que el ServiceAccount esté listo..."
                      sleep 5

                      # Crear Secret para el token (K8s 1.24+)
                      echo "Creando Secret para el token..."
                      cat <<EOF | kubectl apply -f -
                      apiVersion: v1
                      kind: Secret
                      metadata:
                        name: azure-devops-sa-token
                        namespace: devops
                        annotations:
                          kubernetes.io/service-account.name: azure-devops-sa
                      type: kubernetes.io/service-account-token
                      EOF

                      sleep 3

                      # Verificar RBAC
                      echo ""
                      echo "=== Verificando RBAC ==="
                      kubectl get namespace devops
                      kubectl get serviceaccount -n devops
                      kubectl get role,rolebinding -n devops

                      echo ""
                      echo "=== RBAC configurado exitosamente ==="

  - stage: Destroy
    displayName: 'Terraform Destroy (Manual)'
    dependsOn: []
    condition: and(succeeded(), eq(variables['DestroyInfrastructure'], 'true'))
    jobs:
      - deployment: TerraformDestroy
        displayName: 'Destroy Infrastructure'
        environment: 'Development-Destroy'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                # Instalar Terraform
                - template: templates/install-terraform.yml@templates
                  parameters:
                    terraformVersion: $(terraformVersion)

                # Inicializar Terraform
                - template: templates/terraform-init.yml@templates
                  parameters:
                    workingDirectory: $(workingDirectory)
                    backendS3Bucket: $(backendS3Bucket)
                    backendKey: $(backendKey)
                    backendRegion: $(awsRegion)
                    backendDynamoDBTable: $(backendDynamoDBTable)
                    awsAccessKeyId: $(AWS_ACCESS_KEY_ID)
                    awsSecretAccessKey: $(AWS_SECRET_ACCESS_KEY)
                    awsRegion: $(awsRegion)

                # Destruir infraestructura
                - template: templates/terraform-destroy.yml@templates
                  parameters:
                    workingDirectory: $(workingDirectory)
                    awsAccessKeyId: $(AWS_ACCESS_KEY_ID)
                    awsSecretAccessKey: $(AWS_SECRET_ACCESS_KEY)
                    awsRegion: $(awsRegion)
