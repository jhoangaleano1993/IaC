trigger:
  branches:
    include:
      - main
      - dev

  paths:
    include:
      - iac/terraform/**

parameters:
  - name: DestroyInfrastructure
    displayName: 'Destroy Infrastructure'
    type: boolean
    default: false

resources:
  repositories:
    - repository: templates
      type: github
      name: jhoangaleano1993/AzureDevOpsTemplate
      ref: refs/heads/dev
      endpoint: AzureDevOpsTemplate

pool:
  name: Default

variables:
  - name: terraformVersion
    value: '1.13.0'
  - name: workingDirectory
    value: '$(System.DefaultWorkingDirectory)/iac/terraform'
  - name: backendS3Bucket
    value: 'tfstate-devops-289997607932'
  - name: backendDynamoDBTable
    value: 'terraform-state-lock'
  - name: backendKey
    value: 'eks-cluster.tfstate'
  - name: awsRegion
    value: 'us-east-1'
  - group: AWS-Credentials

stages:
  - stage: Validate
    displayName: 'Terraform Validate'
    jobs:
      - job: TerraformValidate
        displayName: 'Validate Terraform Configuration'
        steps:
          - template: templates/install-terraform.yml@templates
            parameters:
              terraformVersion: $(terraformVersion)

          - template: templates/terraform-init.yml@templates
            parameters:
              workingDirectory: $(workingDirectory)
              backendS3Bucket: $(backendS3Bucket)
              backendKey: $(backendKey)
              backendRegion: $(awsRegion)
              backendDynamoDBTable: $(backendDynamoDBTable)
              awsAccessKeyId: $(AWS_ACCESS_KEY_ID)
              awsSecretAccessKey: $(AWS_SECRET_ACCESS_KEY)
              awsRegion: $(awsRegion)

          - template: templates/terraform-validate.yml@templates
            parameters:
              workingDirectory: $(workingDirectory)
              strictFormatCheck: true

  - stage: Plan
    displayName: 'Terraform Plan'
    dependsOn: Validate
    condition: succeeded()
    jobs:
      - job: TerraformPlan
        displayName: 'Plan Infrastructure Changes'
        steps:
          - template: templates/install-terraform.yml@templates
            parameters:
              terraformVersion: $(terraformVersion)

          - template: templates/terraform-init.yml@templates
            parameters:
              workingDirectory: $(workingDirectory)
              backendS3Bucket: $(backendS3Bucket)
              backendKey: $(backendKey)
              backendRegion: $(awsRegion)
              backendDynamoDBTable: $(backendDynamoDBTable)
              awsAccessKeyId: $(AWS_ACCESS_KEY_ID)
              awsSecretAccessKey: $(AWS_SECRET_ACCESS_KEY)
              awsRegion: $(awsRegion)

          - template: templates/terraform-plan.yml@templates
            parameters:
              workingDirectory: $(workingDirectory)
              awsAccessKeyId: $(AWS_ACCESS_KEY_ID)
              awsSecretAccessKey: $(AWS_SECRET_ACCESS_KEY)
              awsRegion: $(awsRegion)
              timeoutInMinutes: 15

          - task: PublishPipelineArtifact@1
            displayName: 'Publish Terraform Plan'
            inputs:
              targetPath: '$(workingDirectory)/tfplan'
              artifact: 'terraform-plan'
              publishLocation: 'pipeline'

          - task: PublishPipelineArtifact@1
            displayName: 'Publish Terraform Files'
            inputs:
              targetPath: '$(workingDirectory)'
              artifact: 'terraform-files'
              publishLocation: 'pipeline'

  - stage: Apply
    displayName: 'Terraform Apply'
    dependsOn: Plan
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/dev'))
    jobs:
      - deployment: TerraformApply
        displayName: 'Apply Infrastructure Changes'
        environment: 'Development'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - template: templates/install-terraform.yml@templates
                  parameters:
                    terraformVersion: $(terraformVersion)
                    installAwsCli: true
                    installKubectl: true

                - task: DownloadPipelineArtifact@2
                  displayName: 'Download Terraform Plan'
                  inputs:
                    artifact: 'terraform-plan'
                    path: '$(workingDirectory)'

                - template: templates/terraform-init.yml@templates
                  parameters:
                    workingDirectory: $(workingDirectory)
                    backendS3Bucket: $(backendS3Bucket)
                    backendKey: $(backendKey)
                    backendRegion: $(awsRegion)
                    backendDynamoDBTable: $(backendDynamoDBTable)
                    awsAccessKeyId: $(AWS_ACCESS_KEY_ID)
                    awsSecretAccessKey: $(AWS_SECRET_ACCESS_KEY)
                    awsRegion: $(awsRegion)

                - template: templates/terraform-apply.yml@templates
                  parameters:
                    workingDirectory: $(workingDirectory)
                    planFile: 'tfplan'
                    awsAccessKeyId: $(AWS_ACCESS_KEY_ID)
                    awsSecretAccessKey: $(AWS_SECRET_ACCESS_KEY)
                    awsRegion: $(awsRegion)

                - task: Bash@3
                  displayName: 'Configure kubectl and verify cluster'
                  inputs:
                    targetType: 'inline'
                    script: |
                      aws eks update-kubeconfig --name devops-eks --region $(awsRegion)
                      echo === Kubernetes Nodes ===
                      kubectl get nodes -o wide
                      echo === All Pods ===
                      kubectl get pods -A
                  env:
                    AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
                    AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
                    AWS_DEFAULT_REGION: $(awsRegion)

                - task: Bash@3
                  displayName: 'Create Application Namespaces'
                  inputs:
                    targetType: 'inline'
                    workingDirectory: '$(System.DefaultWorkingDirectory)/k8s/namespaces'
                    script: |
                      kubectl apply -f dev.yaml
                      kubectl apply -f qa.yaml
                      kubectl apply -f production.yaml
                      kubectl get namespaces
                  env:
                    AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
                    AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
                    AWS_DEFAULT_REGION: $(awsRegion)

                - task: Bash@3
                  displayName: 'Setup RBAC for Azure DevOps'
                  inputs:
                    targetType: 'inline'
                    workingDirectory: '$(System.DefaultWorkingDirectory)/k8s/rbac'
                    script: |
                      kubectl apply -f namespace.yaml
                      kubectl apply -f serviceaccount.yaml
                      kubectl apply -f role.yaml
                      kubectl apply -f rolebinding.yaml
                      kubectl apply -f clusterrole.yaml
                      kubectl apply -f clusterrolebinding.yaml
                      sleep 5
                      cat <<EOF | kubectl apply -f -
                      apiVersion: v1
                      kind: Secret
                      metadata:
                        name: azure-devops-sa-token
                        namespace: devops
                        annotations:
                          kubernetes.io/service-account.name: azure-devops-sa
                      type: kubernetes.io/service-account-token
                      EOF
                      kubectl get serviceaccount -n devops
                  env:
                    AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
                    AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
                    AWS_DEFAULT_REGION: $(awsRegion)

  - stage: Destroy
    displayName: 'Terraform Destroy (Manual)'
    dependsOn: []
    condition: eq('${{ parameters.DestroyInfrastructure }}', 'true')
    jobs:
      - deployment: TerraformDestroy
        displayName: 'Destroy Infrastructure'
        environment: 'Development-Destroy'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - template: templates/install-terraform.yml@templates
                  parameters:
                    terraformVersion: $(terraformVersion)
                    installAwsCli: true
                    installKubectl: true

                - template: templates/terraform-init.yml@templates
                  parameters:
                    workingDirectory: $(workingDirectory)
                    backendS3Bucket: $(backendS3Bucket)
                    backendKey: $(backendKey)
                    backendRegion: $(awsRegion)
                    backendDynamoDBTable: $(backendDynamoDBTable)
                    awsAccessKeyId: $(AWS_ACCESS_KEY_ID)
                    awsSecretAccessKey: $(AWS_SECRET_ACCESS_KEY)
                    awsRegion: $(awsRegion)

                - template: templates/terraform-destroy.yml@templates
                  parameters:
                    workingDirectory: $(workingDirectory)
                    awsAccessKeyId: $(AWS_ACCESS_KEY_ID)
                    awsSecretAccessKey: $(AWS_SECRET_ACCESS_KEY)
                    awsRegion: $(awsRegion)
                    timeoutInMinutes: 45
