apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: azure-devops-rolebinding
  namespace: devops
  labels:
    app: azure-devops
    managed-by: terraform
subjects:
  - kind: ServiceAccount
    name: azure-devops-sa
    namespace: devops
roleRef:
  kind: Role
  name: azure-devops-role
  apiGroup: rbac.authorization.k8s.io
